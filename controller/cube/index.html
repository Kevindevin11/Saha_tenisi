<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi Pong - Cube</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #090d11; color: white; font-family: Arial, sans-serif; }
body { display: flex; }
#gameArea { position: relative; flex: 1; height: 100%; overflow: hidden; background: radial-gradient(circle at center, #1a232c, #080b0f); }
canvas { width: 100%; height: 100%; display: block; }
#panel { width: 260px; height: 100%; padding: 24px 20px; background: #14191f; border-left: 1px solid #303941; display: flex; flex-direction: column; gap: 16px; }
#title { text-align: center; font-size: 24px; font-weight: bold; letter-spacing: 2px; }
.scoreBox { padding: 15px; border-radius: 12px; background: #1b2127; border: 1px solid #353e47; }
.scoreRow { display: flex; justify-content: space-between; padding: 8px 0; font-size: 18px; }
.score { font-weight: bold; }
#state { text-align: center; padding: 10px; border-radius: 9px; background: #1b2127; border: 1px solid #353e47; color: #ff7272; }
.running { color: #6ee18e !important; }
.speedBox { padding: 15px; border-radius: 12px; background: #1b2127; border: 1px solid #353e47; }
.speedTitle { margin-bottom: 12px; font-size: 15px; color: #aab4bd; }
#speedSlider { width: 100%; }
#speedValue { margin-top: 8px; text-align: center; font-family: monospace; color: #b8c1c9; }
button { width: 100%; height: 52px; border-radius: 11px; border: 1px solid #46515b; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
#startButton { background: #286b46; }
#stopButton { background: #763b3b; }
#resetButton { background: #3d5e86; }
#connection { margin-top: auto; text-align: center; font-size: 12px; color: #89939c; }
.connected { color: #6ee18e !important; }
</style>
</head>
<body>

<div id="gameArea">
    <canvas id="game"></canvas>
</div>

<div id="panel">
    <div id="title">MULTI PONG</div>
    <div class="scoreBox">
        <div class="scoreRow"><span>PLAYER 1</span><span id="score1" class="score">0</span></div>
        <div class="scoreRow"><span>PLAYER 2</span><span id="score2" class="score">0</span></div>
    </div>
    <div id="state">STOPPED</div>
    <div class="speedBox">
        <div class="speedTitle">TOP HIZI</div>
        <input id="speedSlider" type="range" min="0.25" max="3" step="0.05" value="1">
        <div id="speedValue">1.00x</div>
    </div>
    <button id="startButton">BAŞLAT</button>
    <button id="stopButton">DURDUR</button>
    <button id="resetButton">SIFIRLA</button>
    <div id="connection">WebSocket bağlanıyor...</div>
</div>

<script>
/* =====================================================
   CANVAS & AYARLAR
===================================================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    player1.x = clampPaddleX(player1.x);
    player2.x = clampPaddleX(player2.x);
}
window.addEventListener("resize", resizeCanvas);

/* =====================================================
   WEBSOCKET
===================================================== */
const connection = document.getElementById("connection");
const protocol = location.protocol === "https:" ? "wss:" : "ws:";
// Sunucuda tanımlı endpoint: /ws/cube
const ws = new WebSocket(`${protocol}//${location.host}/ws/cube`);

let player1Input = 0;
let player2Input = 0;

ws.onopen = function() {
    connection.textContent = "BAĞLANDI";
    connection.classList.add("connected");
    ws.send("ready");
};

ws.onmessage = function(event) {
    let data;
    try {
        data = JSON.parse(event.data);
    } catch(error) {
        return;
    }

    if (data.type !== "control") return;

    // SUNUCUDAN GELEN YENİ FORMAT:
    // { type: "control", player1: 0.5, player2: -0.2 }
    
    if (typeof data.player1 === 'number') {
        player1Input = Math.max(-1, Math.min(1, data.player1));
    }
    
    if (typeof data.player2 === 'number') {
        player2Input = Math.max(-1, Math.min(1, data.player2));
    }
};

ws.onclose = function() {
    connection.textContent = "BAĞLANTI KESİLDİ";
    connection.classList.remove("connected");
};

ws.onerror = function() {
    connection.textContent = "BAĞLANTI HATASI";
};

/* =====================================================
   OYUN MANTIĞI
===================================================== */
let running = false;
let score1 = 0;
let score2 = 0;
let speedMultiplier = 1;

const paddle = { width: 180, height: 18, margin: 45, followSpeed: 20 };
const player1 = { x: 0, targetX: 0, y: 0 };
const player2 = { x: 0, targetX: 0, y: 0 };
const ball = { x: 0, y: 0, radius: 11, vx: 0, vy: 0 };

function clampPaddleX(x) {
    const maximum = Math.max(0, canvas.width - paddle.width);
    return Math.max(0, Math.min(maximum, x));
}

function inputToX(input) {
    const maximum = canvas.width - paddle.width;
    return ((input + 1) * 0.5 * maximum);
}

function updatePaddle(p, input, dt) {
    p.targetX = inputToX(input);
    const difference = p.targetX - p.x;
    const amount = 1 - Math.exp(-paddle.followSpeed * dt);
    p.x += difference * amount;
    p.x = clampPaddleX(p.x);
}

function updatePaddles(dt) {
    updatePaddle(player1, player1Input, dt);
    updatePaddle(player2, player2Input, dt);
    player1.y = paddle.margin;
    player2.y = canvas.height - paddle.margin - paddle.height;
}

function resetBall() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
    const speed = 400;
    const angle = Math.random() * 0.9 - 0.45;
    ball.vx = Math.sin(angle) * speed;
    ball.vy = Math.cos(angle) * speed * (Math.random() < 0.5 ? 1 : -1);
}

function updateScores() {
    document.getElementById("score1").textContent = score1;
    document.getElementById("score2").textContent = score2;
}

function updateState() {
    const state = document.getElementById("state");
    if (running) {
        state.textContent = "RUNNING";
        state.classList.add("running");
    } else {
        state.textContent = "STOPPED";
        state.classList.remove("running");
    }
}

document.getElementById("startButton").onclick = function() { running = true; updateState(); };
document.getElementById("stopButton").onclick = function() { running = false; updateState(); };
document.getElementById("resetButton").onclick = function() {
    score1 = 0; score2 = 0; updateScores();
    running = false; updateState();
    resetBall();
};

const speedSlider = document.getElementById("speedSlider");
const speedValue = document.getElementById("speedValue");
speedSlider.addEventListener("input", function() {
    speedMultiplier = Number(speedSlider.value);
    speedValue.textContent = speedMultiplier.toFixed(2) + "x";
});

function paddleHit(p) {
    return (ball.x + ball.radius > p.x && ball.x - ball.radius < p.x + paddle.width &&
            ball.y + ball.radius > p.y && ball.y - ball.radius < p.y + paddle.height);
}

function handlePaddleCollision() {
    if (ball.vy < 0 && paddleHit(player1)) {
        ball.y = player1.y + paddle.height + ball.radius;
        ball.vy = Math.abs(ball.vy);
        changeAngle(player1);
    }
    if (ball.vy > 0 && paddleHit(player2)) {
        ball.y = player2.y - ball.radius;
        ball.vy = -Math.abs(ball.vy);
        changeAngle(player2);
    }
}

function changeAngle(p) {
    const center = p.x + paddle.width / 2;
    const offset = (ball.x - center) / (paddle.width / 2);
    ball.vx = offset * 500;
}

function handleWalls() {
    if (ball.x - ball.radius <= 0) { ball.x = ball.radius; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.radius >= canvas.width) { ball.x = canvas.width - ball.radius; ball.vx = -Math.abs(ball.vx); }
    if (ball.y + ball.radius < 0) { score2++; updateScores(); resetBall(); }
    if (ball.y - ball.radius > canvas.height) { score1++; updateScores(); resetBall(); }
}

function updateBall(dt) {
    if (!running) return;
    ball.x += ball.vx * dt * speedMultiplier;
    ball.y += ball.vy * dt * speedMultiplier;
    handleWalls();
    handlePaddleCollision();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#ffffff22"; ctx.lineWidth = 2; ctx.setLineDash([12, 12]);
    ctx.beginPath(); ctx.moveTo(0, canvas.height / 2); ctx.lineTo(canvas.width, canvas.height / 2); ctx.stroke(); ctx.setLineDash([]);
    
    ctx.fillStyle = "#5795ff"; ctx.fillRect(player1.x, player1.y, paddle.width, paddle.height);
    ctx.fillStyle = "#64d58b"; ctx.fillRect(player2.x, player2.y, paddle.width, paddle.height);
    
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill();
}

let lastTime = performance.now();
function gameLoop(time) {
    let dt = (time - lastTime) / 1000;
    lastTime = time;
    dt = Math.min(dt, 0.033);
    updatePaddles(dt);
    updateBall(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

resetBall(); updateScores(); updateState(); resizeCanvas();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
